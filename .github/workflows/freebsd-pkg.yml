name: Build & publish FreeBSD pkg

# Runs ONLY when a GitHub Release is published (matching the upstream repo's
# manual vX.Y.Z release process) -> builds the .pkg in a FreeBSD 15.1 VM,
# publishes the pkg repository to GitHub Pages, and attaches the .pkg to that
# release. Servers then get it with `pkg install lead-server` / `pkg upgrade`.
# (workflow_dispatch is kept for manual test builds.)

on:
  release:
    types: [published]
  workflow_dispatch:
    inputs:
      version:
        description: "Package version (without leading v)"
        required: false

permissions:
  contents: write   # gh-pages branch + release assets

jobs:
  build:
    runs-on: ubuntu-latest
    env:
      LEAD_SIGNING_KEY: ${{ secrets.LEAD_REPO_SIGNING_KEY }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0   # tags needed for `git describe`

      - name: Determine version
        id: ver
        run: |
          if [ -n "${{ github.event.inputs.version }}" ]; then
            v="${{ github.event.inputs.version }}"
          elif [ "${{ github.event_name }}" = "release" ]; then
            v="${{ github.event.release.tag_name }}"; v="${v#v}"
          else
            v="0.0.0.$(date +%Y%m%d)"
          fi
          echo "version=$v" >> "$GITHUB_OUTPUT"

      - name: Compute Pages URL
        id: url
        run: |
          owner=$(echo "${{ github.repository_owner }}" | tr 'A-Z' 'a-z')
          repo=$(basename "${{ github.repository }}")
          echo "url=https://${owner}.github.io/${repo}" >> "$GITHUB_OUTPUT"

      - name: Build pkg + repo in FreeBSD VM
        uses: vmactions/freebsd-vm@v1
        with:
          release: "15.1"
          usesh: true
          envs: "LEAD_SIGNING_KEY"
          prepare: |
            pkg install -y git
          run: |
            set -e
            VER='${{ steps.ver.outputs.version }}'
            URL='${{ steps.url.outputs.url }}'
            # --install-deps installs the build deps and auto-detects the latest
            # MariaDB available on this FreeBSD release.
            sh Lead-Tools/freebsd-pkg/build.sh --install-deps --version "$VER"
            if [ -n "${LEAD_SIGNING_KEY:-}" ]; then
              umask 077; printf '%s' "$LEAD_SIGNING_KEY" > /tmp/lead-repo.key
              sh Lead-Tools/freebsd-pkg/make-repo.sh --url "$URL" --key /tmp/lead-repo.key
              rm -f /tmp/lead-repo.key
            else
              sh Lead-Tools/freebsd-pkg/make-repo.sh --url "$URL"
            fi

      - name: Publish repository to GitHub Pages
        uses: peaceiris/actions-gh-pages@v4
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          publish_dir: Lead-Tools/freebsd-pkg/repo-out
          force_orphan: true

      - name: Attach package to the GitHub release
        if: ${{ github.event_name == 'release' }}
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ github.event.release.tag_name }}
          files: Lead-Tools/freebsd-pkg/dist/*.pkg
