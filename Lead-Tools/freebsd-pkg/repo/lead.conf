# Lead pkg repository (client config).
#
# Install this file on each server as:
#     /usr/local/etc/pkg/repos/lead.conf
#
# Then:
#     pkg update
#     pkg install lead-server     # pulls lead-server from here + MariaDB/lzo2
#                                 # from the official FreeBSD repo, in one go
#     pkg upgrade                 # picks up new GitHub releases
#
# Keep the official FreeBSD repo ENABLED (it provides the dependencies). pkg
# resolves dependencies across all enabled repositories.
#
# Replace the url with your GitHub Pages address (user/org + repo name).
# If the catalog is signed, switch signature_type to "pubkey" and drop the
# public key at /usr/local/etc/pkg/keys/lead-repo.pub (see make-repo.sh).

lead: {
    url: "https://INDEX-S.github.io/lead-files-community",
    enabled: yes,
    signature_type: "none",
}
